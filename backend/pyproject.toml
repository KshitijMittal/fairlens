[project]
name = "fairlens-backend"
version = "2.0.0"
description = "FairLens v2 backend - the analysis engine and FastAPI app"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "numpy==2.2.6",
    "pandas==3.1.0",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "shap==0.54.1",
    "fairlearn==0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
